<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="chrome">
      <div id="titlebar">
        <h1 id="docname">Untitled</h1>
        <span id="format"></span>
        <span id="status" aria-live="polite"></span>
      </div>

      <div id="toolbar" role="toolbar" aria-label="Formatting">
        <button type="button" data-action="undo" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
        </button>
        <button type="button" data-action="redo" title="Redo (⌘⇧Z)" aria-label="Redo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
          </svg>
        </button>

        <span class="divider"></span>

        <select id="block-style" aria-label="Paragraph style">
          <option value="body">Normal text</option>
          <option value="h1">Title</option>
          <option value="h2">Heading</option>
          <option value="h3">Subheading</option>
        </select>

        <span class="divider"></span>

        <button type="button" data-action="bold" title="Bold (⌘B)" aria-label="Bold">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/>
          </svg>
        </button>
        <button type="button" data-action="italic" title="Italic (⌘I)" aria-label="Italic">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/>
          </svg>
        </button>

        <span class="divider"></span>

        <button type="button" data-action="outdent" title="Decrease indent (⇧Tab)" aria-label="Decrease indent">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 17h10v-2H11v2zM3 12l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/>
          </svg>
        </button>
        <button type="button" data-action="indent" title="Increase indent (Tab)" aria-label="Increase indent">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/>
          </svg>
        </button>

        <span class="divider"></span>

        <button type="button" data-action="image" title="Insert image (⌘⇧I)" aria-label="Insert image">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="canvas">
      <div id="page">
        <div id="editor"></div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
