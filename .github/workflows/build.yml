name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The whole point of the exercise. Enforced per platform below.
  BUDGET_BYTES: 2097152

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS, artifact: dist-app }
          - { os: ubuntu-latest, name: Linux, artifact: dist-app }
          - { os: windows-latest, name: Windows, artifact: dist-app }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # wry needs the system webview headers on Linux. macOS and Windows use
      # WKWebView and WebView2, both already present on the runners.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build release binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      # Bash is available on all three runners, so one script covers the matrix.
      - name: Package
        shell: bash
        run: bash scripts/package.sh

      - name: Enforce size budget
        shell: bash
        run: |
          if [ -d "dist-app/Text Editor.app" ]; then
            target="dist-app/Text Editor.app"
          elif [ -f "dist-app/text-editor.exe" ]; then
            target="dist-app/text-editor.exe"
          else
            target="dist-app/text-editor"
          fi

          bytes=$(find "$target" -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {print s}') \
            || bytes=$(find "$target" -type f -exec stat -f%z {} + | awk '{s+=$1} END {print s}')

          printf '%s: %s bytes (%.2f MB), budget %.2f MB\n' \
            "$target" "$bytes" \
            "$(awk -v b="$bytes" 'BEGIN{print b/1048576}')" \
            "$(awk -v b="$BUDGET_BYTES" 'BEGIN{print b/1048576}')"

          if [ "$bytes" -gt "$BUDGET_BYTES" ]; then
            echo "::error::${{ matrix.name }} artifact is over the 2MB budget"
            exit 1
          fi
          echo "${{ matrix.name }} is under budget."

      - uses: actions/upload-artifact@v4
        with:
          name: text-editor-${{ matrix.name }}
          path: dist-app/
