name: release

# build.yml proves every commit still fits the budget, but its artifacts are
# Actions artifacts: they need a GitHub login to fetch and expire after 90 days.
# This workflow turns a tag into a real Release with permanent public downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - run: npm ci

      # The binary embeds the built frontend with include_bytes!, so dist/ must
      # exist before rustc runs.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml

      # Also enforces the 2MB budget -- a release cannot be cut over budget.
      - name: Package and archive
        shell: bash
        run: bash scripts/archive.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --title "Text Editor $TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag
