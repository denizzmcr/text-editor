name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # wry needs the system webview headers on Linux, and muda links against
      # libxdo for X11 accelerator handling. macOS and Windows use WKWebView
      # and WebView2, both already present on the runners.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - run: npm ci

      # Must come before the Rust steps: the binary embeds the built frontend
      # with include_bytes!, so dist/ has to exist before rustc runs.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml

      # Builds the release binary, assembles the platform artifact, prints its
      # size, and exits non-zero if it exceeds the 2MB budget. Bash is present
      # on all three runners, so one script covers the matrix.
      - name: Package and enforce size budget
        shell: bash
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: text-editor-${{ matrix.name }}
          path: dist-app/
